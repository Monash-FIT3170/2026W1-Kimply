# Production stack for Kimply.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Differences from docker-compose.yml (development), all deliberate:
#   - No MongoDB container. Production uses MongoDB Atlas over mongodb+srv://.
#   - No bind mounts of source, and no `build:`. The image is pulled by exact
#     commit SHA; the production host never runs a Meteor build.
#   - The app publishes NO ports. Only nginx is reachable from outside.

services:
  app:
    # Fully-qualified image reference including the tag, written by deploy/deploy.sh.
    # Intentionally has no default: an unset value must fail loudly at
    # `docker compose config` rather than resolve to something unintended.
    image: ${APP_IMAGE}
    container_name: kimply-app
    restart: unless-stopped
    # Docker's built-in tini as PID 1, so signals are forwarded and children
    # reaped. Matters for a clean DDP shutdown on redeploy.
    init: true

    # NOTE: deliberately no `ports:`. The app is reachable only as http://app:3000
    # on this network. Port 3000 is never bound on the host, so nothing depends on
    # a firewall rule to keep it private.

    environment:
      MONGO_URL: ${MONGO_URL}
      ROOT_URL: ${ROOT_URL}
      PORT: 3000

    # The healthcheck is defined in the image (app/Dockerfile) and is inherited
    # here, which is what lets nginx gate on service_healthy below.

    mem_limit: 2g

    # Without rotation the json-file driver will fill the 30 GB root volume.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: kimply-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # CRITICAL: restrict envsubst to DOMAIN only. Without this filter the
      # entrypoint substitutes every $VAR in the template, including nginx's own
      # $host, $remote_addr and $http_upgrade, silently producing a broken config.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      # Neutralise the base image's stock server block. See the file for why.
      - ./nginx/disable-default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Not started by `up`. Invoked on demand:
  #   docker compose -f docker-compose.prod.yml run --rm certbot <args>
  # A permanently-running certbot container would just sleep; renewal is driven
  # by a host cron entry installed by deploy/bootstrap-ec2.sh.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  certbot_www:
  letsencrypt:
