name: E2E
on:
  pull_request:
    branches: [main, dev]
concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          tags: kimply-e2e:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start MongoDB and the app
        run: |
          docker network create kimply-e2e
          docker run -d --name mongo --network kimply-e2e -p 27017:27017 mongo:7.0
          docker run -d --name app --network kimply-e2e -p 3000:3000 \
            -e MONGO_URL=mongodb://mongo:27017/kimply -e ROOT_URL=http://localhost:3000 \
            -e PORT=3000 -e HTTP_FORWARDED_COUNT=0 -e METEOR_POLLING_INTERVAL_MS=1000 kimply-e2e:ci
          for i in $(seq 1 60); do curl -sf localhost:3000/health/ready && exit 0; sleep 2; done
          docker logs app; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: "true"
      - if: failure()
        run: docker logs app > e2e/app.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/app.log
