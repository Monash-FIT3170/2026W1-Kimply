# Build the arm64 image, push it to ECR by commit SHA, and deploy it to the
# instance for this branch.
#
#   main -> production   (kimply.online)
#   dev  -> development  (dev.kimply.online)
#
# The two environments share nothing: not the instance, not the Elastic IP, not
# the ECR repository, not the IAM roles, not the database, not the certificate.
# The only thing they share is this file.
name: Deploy

on:
  push:
    branches: [main, dev]

# The two branches deploy to two independent stacks, so they must not share a
# queue. cancel-in-progress stays false: a half-finished deploy is worse than a
# slow one.
concurrency:
  group: kimply-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TAG: ${{ github.sha }}
  ECR_REPOSITORY: ${{ github.ref_name == 'main' && 'kimply' || 'kimply-dev' }}
  INSTANCE_ID: ${{ github.ref_name == 'main' && 'i-08184036cf37c932c' || 'i-09575e88c984e1c7d' }}
  ECR_ROLE: ${{ github.ref_name == 'main' && 'arn:aws:iam::827152325060:role/GitHubActionsECRPush' || 'arn:aws:iam::827152325060:role/GitHubActionsECRPushDev' }}
  SSM_ROLE: ${{ github.ref_name == 'main' && 'arn:aws:iam::827152325060:role/GitHubActionsEC2Commands' || 'arn:aws:iam::827152325060:role/GitHubActionsEC2CommandsDev' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      # A branch added to the trigger above without a matching entry in the env
      # block would otherwise resolve to the development target and quietly
      # deploy the wrong code to dev. Fail instead.
      - name: Guard against an unconfigured target
        run: |
          echo "Branch      : ${{ github.ref_name }}"
          echo "ECR repo    : $ECR_REPOSITORY"
          echo "Instance    : $INSTANCE_ID"
          case "${{ github.ref_name }}" in
            main|dev) ;;
            *) echo "::error::no deployment target configured for '${{ github.ref_name }}'"; exit 1 ;;
          esac
          case "$INSTANCE_ID" in
            i-*) ;;
            *) echo "::error::INSTANCE_ID is not a valid instance id: '$INSTANCE_ID'"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build-push.sh reads ECR_REPOSITORY and AWS_REGION from the environment
      # and derives the registry from the caller identity, so it needs no
      # per-environment arguments.
      - name: Build and Push Docker Image
        run: ./deploy/build-push.sh

      - name: Configure AWS credentials EC2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.SSM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and Deploy Docker Image
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['/opt/kimply/deploy/deploy.sh $TAG']" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          [ "$STATUS" = "Success" ]
