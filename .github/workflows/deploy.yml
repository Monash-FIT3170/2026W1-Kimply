# Build the arm64 image, push it to ECR by commit SHA, and deploy it.
#
#   main -> production on ECS Fargate   (kimply.online)
#   dev  -> development on ECS Fargate  (dev.kimply.online)
#
# Every branch-specific value is resolved in ONE place, the `config` job below.
# Adding an environment (staging, say) is one more arm of its case statement plus
# a matching infra/terraform/envs/<name>. An unrecognised branch fails there
# rather than silently deploying somewhere.
#
# ECS is the only deploy target. The old SSM path to the EC2 instances is gone,
# so kimply.online and dev.kimply.online keep serving whatever they last received
# until each cutover points its DNS at the load balancer. To ship to one of them
# in the meantime, run deploy/deploy.sh on that instance by hand.
name: Deploy

on:
  push:
    branches: [main, dev]

# Branches deploy to independent stacks, so they must not share a queue.
# cancel-in-progress stays false: a half-finished deploy is worse than a slow one.
concurrency:
  group: kimply-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TAG: ${{ github.sha }}

jobs:
  config:
    runs-on: ubuntu-24.04-arm

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      ecr_repository: ${{ steps.resolve.outputs.ecr_repository }}
      ecr_role: ${{ steps.resolve.outputs.ecr_role }}
      ecs_role: ${{ steps.resolve.outputs.ecs_role }}
      ecs_cluster: ${{ steps.resolve.outputs.ecs_cluster }}
      ecs_service: ${{ steps.resolve.outputs.ecs_service }}
      service_url: ${{ steps.resolve.outputs.service_url }}
      task_def_template: ${{ steps.resolve.outputs.task_def_template }}

    steps:
      # The branch name reaches the script through the environment rather than by
      # string substitution, so a branch name can never be read as shell.
      - name: Resolve deployment targets
        id: resolve
        env:
          REF: ${{ github.ref_name }}
          ACCOUNT: "827152325060"
        run: |
          set -euo pipefail

          case "$REF" in
            main)
              environment=production
              ecr_repository=kimply
              ecr_role="arn:aws:iam::$ACCOUNT:role/GitHubActionsECRPush"
              ecs_role="arn:aws:iam::$ACCOUNT:role/kimply-prod-github-deploy"
              ecs_cluster=kimply-prod
              ecs_service=kimply-prod
              service_url=https://www.kimply.online
              task_def_template=infra/ecs/task-definition.prod.json
              ;;
            dev)
              environment=development
              ecr_repository=kimply-dev
              ecr_role="arn:aws:iam::$ACCOUNT:role/GitHubActionsECRPushDev"
              ecs_role="arn:aws:iam::$ACCOUNT:role/kimply-dev-github-deploy"
              ecs_cluster=kimply-dev
              ecs_service=kimply-dev
              service_url=https://dev.kimply.online
              task_def_template=infra/ecs/task-definition.dev.json
              ;;
            *)
              echo "::error::no deployment target configured for branch '$REF'."
              echo "::error::Add a case arm here and a matching infra/terraform/envs/<name>."
              exit 1
              ;;
          esac

          {
            echo "environment=$environment"
            echo "ecr_repository=$ecr_repository"
            echo "ecr_role=$ecr_role"
            echo "ecs_role=$ecs_role"
            echo "ecs_cluster=$ecs_cluster"
            echo "ecs_service=$ecs_service"
            echo "service_url=$service_url"
            echo "task_def_template=$task_def_template"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Deploying $environment (branch \`$REF\`)"
            echo ""
            echo "| Target | Value |"
            echo "|---|---|"
            echo "| ECR repository | \`$ecr_repository\` |"
            echo "| ECS cluster / service | \`$ecs_cluster\` / \`$ecs_service\` |"
            echo "| Task definition | \`$task_def_template\` |"
            echo "| Smoke test | $service_url |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: config
    runs-on: ubuntu-24.04-arm

    env:
      ECR_REPOSITORY: ${{ needs.config.outputs.ecr_repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.config.outputs.ecr_role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build-push.sh reads ECR_REPOSITORY and AWS_REGION from the environment
      # and derives the registry from the caller identity.
      - name: Build and Push Docker Image
        run: ./deploy/build-push.sh

  deploy-ecs:
    needs: [config, build]
    runs-on: ubuntu-24.04-arm

    env:
      ECR_REPOSITORY: ${{ needs.config.outputs.ecr_repository }}
      ECS_CLUSTER: ${{ needs.config.outputs.ecs_cluster }}
      ECS_SERVICE: ${{ needs.config.outputs.ecs_service }}
      SERVICE_URL: ${{ needs.config.outputs.service_url }}
      TASK_DEF_TEMPLATE: ${{ needs.config.outputs.task_def_template }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Can register task definitions and update this environment's service only.
      - name: Configure AWS credentials ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.config.outputs.ecs_role }}
          aws-region: ${{ env.AWS_REGION }}

      # Registers a revision from this environment's template, waits for ECS to
      # report the rollout COMPLETED (circuit breaker and canary alarm roll back
      # on their own), then probes /health/ready on the public URL.
      - name: Deploy to ECS
        run: ./deploy/ecs-deploy.sh "$TAG"
