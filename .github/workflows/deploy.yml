# Build the arm64 image, push it to ECR by commit SHA, and deploy it.
#
#   main -> production on ECS Fargate      (ecs.kimply.online, www at cutover)
#        -> production EC2 instance        (kimply.online, until cutover)
#   dev  -> development on ECS Fargate     (ecs-dev.kimply.online)
#        -> development EC2 instance       (dev.kimply.online, until cutover)
#
# Every branch-specific value is resolved in ONE place, the `config` job below.
# Adding an environment (staging, say) is one more arm of its case statement plus
# a matching infra/terraform/envs/<name>. An unrecognised branch fails there
# rather than silently deploying somewhere.
#
# During the parallel run (docs/ecs-target-architecture.md, D37/D39) each branch
# deploys to BOTH of its stacks so they always serve the same version. At each
# cutover, set that branch's deploy_ec2 to false.
#
# The EC2 job runs only from the upstream repository, because the SSM roles trust
# only it. The ECR and ECS roles trust the migration fork as well, so the fork
# builds and deploys to ECS but skips EC2.
name: Deploy

on:
  push:
    branches: [main, dev]

# Branches deploy to independent stacks, so they must not share a queue.
# cancel-in-progress stays false: a half-finished deploy is worse than a slow one.
concurrency:
  group: kimply-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TAG: ${{ github.sha }}

jobs:
  config:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      ecr_repository: ${{ steps.resolve.outputs.ecr_repository }}
      ecr_role: ${{ steps.resolve.outputs.ecr_role }}
      ecs_role: ${{ steps.resolve.outputs.ecs_role }}
      ecs_cluster: ${{ steps.resolve.outputs.ecs_cluster }}
      ecs_service: ${{ steps.resolve.outputs.ecs_service }}
      service_url: ${{ steps.resolve.outputs.service_url }}
      task_def_template: ${{ steps.resolve.outputs.task_def_template }}
      deploy_ec2: ${{ steps.resolve.outputs.deploy_ec2 }}
      instance_id: ${{ steps.resolve.outputs.instance_id }}
      ssm_role: ${{ steps.resolve.outputs.ssm_role }}

    steps:
      # The branch name reaches the script through the environment rather than by
      # string substitution, so a branch name can never be read as shell.
      - name: Resolve deployment targets
        id: resolve
        env:
          REF: ${{ github.ref_name }}
          ACCOUNT: "827152325060"
        run: |
          set -euo pipefail

          case "$REF" in
            main)
              environment=production
              ecr_repository=kimply
              ecr_role="arn:aws:iam::$ACCOUNT:role/GitHubActionsECRPush"
              ecs_role="arn:aws:iam::$ACCOUNT:role/kimply-prod-github-deploy"
              ecs_cluster=kimply-prod
              ecs_service=kimply-prod
              service_url=https://ecs.kimply.online
              task_def_template=infra/ecs/task-definition.prod.json
              deploy_ec2=true
              instance_id=i-08184036cf37c932c
              ssm_role="arn:aws:iam::$ACCOUNT:role/GitHubActionsEC2Commands"
              ;;
            dev)
              environment=development
              ecr_repository=kimply-dev
              ecr_role="arn:aws:iam::$ACCOUNT:role/GitHubActionsECRPushDev"
              ecs_role="arn:aws:iam::$ACCOUNT:role/kimply-dev-github-deploy"
              ecs_cluster=kimply-dev
              ecs_service=kimply-dev
              service_url=https://ecs-dev.kimply.online
              task_def_template=infra/ecs/task-definition.dev.json
              deploy_ec2=true
              instance_id=i-09575e88c984e1c7d
              ssm_role="arn:aws:iam::$ACCOUNT:role/GitHubActionsEC2CommandsDev"
              ;;
            *)
              echo "::error::no deployment target configured for branch '$REF'."
              echo "::error::Add a case arm here and a matching infra/terraform/envs/<name>."
              exit 1
              ;;
          esac

          {
            echo "environment=$environment"
            echo "ecr_repository=$ecr_repository"
            echo "ecr_role=$ecr_role"
            echo "ecs_role=$ecs_role"
            echo "ecs_cluster=$ecs_cluster"
            echo "ecs_service=$ecs_service"
            echo "service_url=$service_url"
            echo "task_def_template=$task_def_template"
            echo "deploy_ec2=$deploy_ec2"
            echo "instance_id=$instance_id"
            echo "ssm_role=$ssm_role"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Deploying $environment (branch \`$REF\`)"
            echo ""
            echo "| Target | Value |"
            echo "|---|---|"
            echo "| ECR repository | \`$ecr_repository\` |"
            echo "| ECS cluster / service | \`$ecs_cluster\` / \`$ecs_service\` |"
            echo "| Task definition | \`$task_def_template\` |"
            echo "| Smoke test | $service_url |"
            echo "| Also deploy EC2 | $deploy_ec2 |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: config
    runs-on: ubuntu-24.04-arm

    env:
      ECR_REPOSITORY: ${{ needs.config.outputs.ecr_repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.config.outputs.ecr_role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build-push.sh reads ECR_REPOSITORY and AWS_REGION from the environment
      # and derives the registry from the caller identity.
      - name: Build and Push Docker Image
        run: ./deploy/build-push.sh

  deploy-ecs:
    needs: [config, build]
    runs-on: ubuntu-24.04-arm

    env:
      ECR_REPOSITORY: ${{ needs.config.outputs.ecr_repository }}
      ECS_CLUSTER: ${{ needs.config.outputs.ecs_cluster }}
      ECS_SERVICE: ${{ needs.config.outputs.ecs_service }}
      SERVICE_URL: ${{ needs.config.outputs.service_url }}
      TASK_DEF_TEMPLATE: ${{ needs.config.outputs.task_def_template }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Can register task definitions and update this environment's service only.
      - name: Configure AWS credentials ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.config.outputs.ecs_role }}
          aws-region: ${{ env.AWS_REGION }}

      # Registers a revision from this environment's template, waits for ECS to
      # report the rollout COMPLETED (circuit breaker and canary alarm roll back
      # on their own), then probes /health/ready on the public URL.
      - name: Deploy to ECS
        run: ./deploy/ecs-deploy.sh "$TAG"

  deploy-ec2:
    # Until this environment's cutover, and upstream only: the SSM roles trust
    # only the upstream repository.
    needs: [config, build]
    if: needs.config.outputs.deploy_ec2 == 'true' && github.repository == 'Monash-FIT3170/2026W1-Kimply'
    runs-on: ubuntu-24.04-arm

    env:
      INSTANCE_ID: ${{ needs.config.outputs.instance_id }}

    steps:
      - name: Configure AWS credentials EC2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.config.outputs.ssm_role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and Deploy Docker Image
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['/opt/kimply/deploy/deploy.sh $TAG']" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          [ "$STATUS" = "Success" ]
