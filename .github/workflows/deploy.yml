# Build the arm64 image, push it to ECR by commit SHA, and deploy it.
#
#   main -> production on ECS Fargate      (ecs.kimply.online, www at cutover)
#        -> production EC2 instance        (kimply.online, until cutover)
#   dev  -> development on ECS Fargate     (ecs-dev.kimply.online)
#        -> development EC2 instance       (dev.kimply.online, until cutover)
#
# During the parallel run (docs/ecs-target-architecture.md, D37/D39) main deploys
# to BOTH production stacks so they always serve the same version. At cutover the
# main half of deploy-ec2 is removed.
#
# The EC2 job runs only from the upstream repository, because the SSM roles trust
# only it. The ECR and ECS roles trust the migration fork as well, so the fork
# builds and deploys to ECS but skips EC2.
name: Deploy

on:
  push:
    branches: [main, dev]

# The two branches deploy to independent stacks, so they must not share a queue.
# cancel-in-progress stays false: a half-finished deploy is worse than a slow one.
concurrency:
  group: kimply-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  TAG: ${{ github.sha }}
  ECR_REPOSITORY: ${{ github.ref_name == 'main' && 'kimply' || 'kimply-dev' }}
  ECR_ROLE: ${{ github.ref_name == 'main' && 'arn:aws:iam::827152325060:role/GitHubActionsECRPush' || 'arn:aws:iam::827152325060:role/GitHubActionsECRPushDev' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      # A branch added to the trigger above without a matching entry in the env
      # block would otherwise resolve to the development target. Fail instead.
      - name: Guard against an unconfigured target
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "ECR repo   : $ECR_REPOSITORY"
          case "${{ github.ref_name }}" in
            main|dev) ;;
            *) echo "::error::no deployment target configured for '${{ github.ref_name }}'"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build-push.sh reads ECR_REPOSITORY and AWS_REGION from the environment
      # and derives the registry from the caller identity.
      - name: Build and Push Docker Image
        run: ./deploy/build-push.sh

  deploy-ecs:
    needs: build
    runs-on: ubuntu-24.04-arm

    env:
      ECS_ROLE: ${{ github.ref_name == 'main' && 'arn:aws:iam::827152325060:role/kimply-prod-github-deploy' || 'arn:aws:iam::827152325060:role/kimply-dev-github-deploy' }}
      ECS_CLUSTER: ${{ github.ref_name == 'main' && 'kimply-prod' || 'kimply-dev' }}
      ECS_SERVICE: ${{ github.ref_name == 'main' && 'kimply-prod' || 'kimply-dev' }}
      SERVICE_URL: ${{ github.ref_name == 'main' && 'https://ecs.kimply.online' || 'https://ecs-dev.kimply.online' }}
      TASK_DEF_TEMPLATE: ${{ github.ref_name == 'main' && 'infra/ecs/task-definition.prod.json' || 'infra/ecs/task-definition.dev.json' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Can register task definitions and update the kimply-prod service only.
      - name: Configure AWS credentials ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Registers a revision from this environment's template, waits for ECS to
      # report the rollout COMPLETED (circuit breaker and canary alarm roll back
      # on their own), then probes /health/ready on the public URL.
      - name: Deploy to ECS
        run: ./deploy/ecs-deploy.sh "$TAG"

  deploy-ec2:
    # dev always; main only until cutover. Upstream only, because these roles
    # trust only the upstream repository.
    if: github.repository == 'Monash-FIT3170/2026W1-Kimply'
    needs: build
    runs-on: ubuntu-24.04-arm

    env:
      INSTANCE_ID: ${{ github.ref_name == 'main' && 'i-08184036cf37c932c' || 'i-09575e88c984e1c7d' }}
      SSM_ROLE: ${{ github.ref_name == 'main' && 'arn:aws:iam::827152325060:role/GitHubActionsEC2Commands' || 'arn:aws:iam::827152325060:role/GitHubActionsEC2CommandsDev' }}

    steps:
      - name: Guard against an unconfigured instance
        run: |
          echo "Instance : $INSTANCE_ID"
          case "$INSTANCE_ID" in
            i-*) ;;
            *) echo "::error::INSTANCE_ID is not a valid instance id: '$INSTANCE_ID'"; exit 1 ;;
          esac

      - name: Configure AWS credentials EC2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.SSM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and Deploy Docker Image
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['/opt/kimply/deploy/deploy.sh $TAG']" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          [ "$STATUS" = "Success" ]
