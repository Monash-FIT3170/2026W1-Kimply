name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: kimply
  TAG: ${{ github.sha }}
  INSTANCE_ID: i-08184036cf37c932c

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::827152325060:role/GitHubActionsECRPush
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:$TAG ./app

      - name: Tag and Push Docker Image
        run: |
          docker tag $ECR_REPOSITORY:$TAG \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$TAG
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$TAG

      - name: Configure AWS credentials EC2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::827152325060:role/GitHubActionsEC2Commands
          aws-region: ap-southeast-2

      - name: Pull and Deploy Docker Image
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['/opt/kimply/deploy/deploy.sh $TAG']" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region ap-southeast-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
