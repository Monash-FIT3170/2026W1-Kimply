# Main nginx context for Kimply.
#
# Server blocks live in conf.d/, generated at container start by the official
# image's entrypoint from nginx/templates/*.template (see docker-compose.prod.yml).

user  nginx;
worker_processes  auto;

# Raise the per-worker file-descriptor limit to match worker_connections below.
# Without this nginx warns "worker_connections exceed open file resource limit"
# and silently caps at the container default of 1024 - which at 100 players, each
# holding a long-lived WebSocket plus asset requests, would look like an
# unexplained plateau under load rather than a configuration error.
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Every player holds one long-lived DDP connection for their whole session,
    # on top of the short-lived requests for the bundle and assets. The stock
    # default of 768 is uncomfortably close at the 100-player target.
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $request_time vs $upstream_response_time is the primary bottleneck-attribution
    # signal: if request_time is much larger than upstream_response_time the delay is
    # in nginx or the network, not in Meteor.
    log_format  kimply  '$remote_addr - $status "$request" '
                        'rt=$request_time urt=$upstream_response_time ua=$upstream_addr '
                        'bytes=$body_bytes_sent "$http_user_agent"';

    access_log  /var/log/nginx/access.log  kimply;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # No uploads anywhere in this app.
    client_max_body_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    # Meteor serves its JS/CSS bundles pre-compressed, so this mainly covers the
    # HTML shell and DDP's initial JSON payloads.
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
