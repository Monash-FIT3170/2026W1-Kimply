# Intentionally empty.
#
# Mounted over /etc/nginx/conf.d/default.conf to neutralise the stock server block
# that ships in the nginx base image.
#
# Why this matters: conf.d files are included in alphabetical order, so
# "default.conf" is read before "kimply.conf" and its server block becomes the
# default server for port 80. Any request whose Host header does not match our
# server_name - a bare hit on the Elastic IP, a scanner, a stale DNS entry - would
# then be answered with the nginx welcome page instead of being redirected to
# HTTPS, which both leaks the server identity and breaks the redirect.
#
# kimply.conf additionally marks its own listeners as default_server, so the
# behaviour is deterministic even if this mount is ever removed.
